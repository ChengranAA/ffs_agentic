  <circle cx="54" cy="225" r="5" fill="none" stroke="#9aa1ab" stroke-width="1.5"/><text x="70" y="229" font-size="12.5" fill="#4b5563">QC</text><text x="220" y="229" font-size="10.5" fill="#9aa1ab" text-anchor="end">2</text>
