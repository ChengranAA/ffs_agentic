    <text x="272" y="512" fill="#4b5563">Per-stage option overrides</text><text x="492" y="512" fill="#9aa1ab" text-anchor="end">31</text>
  </g>
  <rect x="272" y="528" width="220" height="1" fill="#eceef2"/>
