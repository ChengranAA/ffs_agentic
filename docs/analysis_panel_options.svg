  <!-- footer -->
  <rect x="272" y="660" width="940" height="1" fill="#eceef2"/>
  <text x="272" y="682" font-size="10" fill="#374151">Every field is one <tspan font-family="SFMono-Regular,Menlo,monospace" font-size="9.5">ffs_autoproc</tspan> flag; the generated command and script use exactly these values.</text>
  <text x="272" y="700" font-size="9.5" fill="#9aa1ab">Fields you never touch stay absent from the command — autoproc defaults apply, and the recipe's presets are shown in the stage inspector.</text>
  <text x="272" y="718" font-size="9.5" fill="#9aa1ab">Unmapped flags still live here; the stage board only curates the ones a stage owns.</text>
  <text x="272" y="742" font-size="9" fill="#9aa1ab">schema: autoproc/1 · FFS ref 8b2f775 (autoproc unchanged) · cached 17:58</text>
  <rect x="1014" y="744" width="80" height="28" rx="7" fill="#ffffff" stroke="#d5d9e0"/><text x="1054" y="762" font-size="10.5" fill="#374151" text-anchor="middle">Close</text>
  <rect x="1104" y="744" width="108" height="28" rx="7" fill="#3b6cf6"/><text x="1158" y="762" font-size="10.5" fill="#ffffff" text-anchor="middle">Save v5</text>
