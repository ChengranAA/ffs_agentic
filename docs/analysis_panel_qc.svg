  <text x="899" y="463" font-size="9" fill="#ffffff" text-anchor="middle">medium</text>
  <rect x="928" y="449" width="40" height="20" rx="10" fill="#ffffff" stroke="#e4e6eb"/>
  <text x="948" y="463" font-size="9" fill="#6b7280" text-anchor="middle">high</text>
  <rect x="1008" y="466" width="96" height="26" rx="6" fill="#3b6cf6"/>
  <text x="1056" y="483" font-size="10.5" fill="#ffffff" text-anchor="middle">Save decision</text>
  <rect x="1112" y="466" width="70" height="26" rx="6" fill="#ffffff" stroke="#e4e6eb"/>
