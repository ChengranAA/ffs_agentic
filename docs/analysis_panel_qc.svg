  <text x="1120" y="634" font-size="10" fill="#374151">user</text>

  <text x="272" y="662" font-size="10.5" fill="#374151">17:38</text>
  <text x="340" y="662" font-size="10.5" fill="#374151">run-01 · qc/fd.png · sha 2b7e…</text>
  <rect x="720" y="648" width="76" height="20" rx="10" fill="#eaf6ee" stroke="#b7e1c1"/>
  <text x="758" y="662" font-size="9.5" fill="#23663a" text-anchor="middle">accepted</text>
  <text x="820" y="662" font-size="10" fill="#9aa1ab">not stated</text>
  <text x="1120" y="662" font-size="10" fill="#374151">user</text>

  <rect x="272" y="686" width="940" height="38" rx="8" fill="#f8f9fb" stroke="#eceef2"/>
  <text x="284" y="703" font-size="10" fill="#6b7280">Target = run + reviewed file + sha, so a verdict can be cited, superseded and shipped with the package.</text>
  <text x="284" y="717" font-size="10" fill="#6b7280">A tentative or rejected run stays visible in the cohort until a later decision supersedes it.</text>

  <!-- footer note -->
  <g filter="url(#soft)">
    <rect x="252" y="752" width="980" height="60" rx="12" fill="#ffffff" stroke="#e4e6eb"/>
  </g>
  <text x="272" y="778" font-size="10.5" fill="#374151">Judgment stays separate from measurement: figures and the QC table are computed; the decision, its actor and its reason are recorded beside them.</text>
  <text x="272" y="797" font-size="10" fill="#9aa1ab">No rationale is invented: choosing “not stated” is a recorded value, not a blank.</text>
  <text x="1212" y="797" font-size="10.5" fill="#3b6cf6" text-anchor="end">view full record →</text>
